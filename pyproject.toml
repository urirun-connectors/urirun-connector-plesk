[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urirun-connector-plesk"
version = "0.12.4"
description = "Secure multi-transport Plesk connector with REST, XML, SFTP and profiled extension discovery"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "if-uri"}]
dependencies = ["urirun>=0.4.14", "paramiko>=3.4", "cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=8"]
sftp = ["paramiko>=3.4"]  # kept for back-compat; paramiko is now a hard dependency (PR6)

[project.scripts]
urirun-connector-plesk = "urirun_connector_plesk.core:main"

[project.entry-points."urirun.bindings"]
plesk = "urirun_connector_plesk.core:urirun_bindings"

[tool.setuptools.packages.find]
where = ["."]
include = ["urirun_connector_plesk*"]

[tool.setuptools.package-data]
urirun_connector_plesk = ["connector.manifest.json", "contracts.json", "extension_profiles.json"]
