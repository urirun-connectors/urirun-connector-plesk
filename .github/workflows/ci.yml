name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout urirun-connector-plesk
        uses: actions/checkout@v4

      - name: Checkout urirun
        uses: actions/checkout@v4
        with:
          repository: if-uri/urirun
          path: _deps/urirun

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install urirun and connector from source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./_deps/urirun/adapters/python"
          python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest tests -q

      - name: Verify packaged metadata
        run: |
          python - <<'PY'
          import json
          from importlib.resources import files

          package = files("urirun_connector_plesk")
          manifest = json.loads(package.joinpath("connector.manifest.json").read_text())
          contracts = json.loads(package.joinpath("contracts.json").read_text())

          assert manifest["id"] == "plesk"
          assert contracts
          PY
